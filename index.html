<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estudiantes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Sistema de Estudiantes</h1>
        <p>Registro y Control de notas de estudiantes</p>
    </header>

    <main>
        <section>
            <h2>Agregar estudiante</h2>

            <form id="formularioEstudiante">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos">

                <label for="nota">Nota:</label>
                <input type="number" id="nota" min="0" max="100">

                <button type="button" id="btnAgregar">Agregar estudiante</button>

                <p id="mensaje"></p>
            </form>
        </section>

        <section>
            <h2>Lista de estudiantes</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Nota</th>
                    </tr>
                </thead>
                <tbody id="tablaEstudiantes"></tbody>
            </table>
        </section>

        <section>
            <h2>Resumen de notas</h2>
            <p id="notaMayor"></p>
            <p id="promedio"></p>
            <p id="notaMenor"></p>
        </section>
    </main>

    <footer>
        <p>Sistema de Estudiantes - 2026</p>
    </footer>

</body>
</html>
